# 매일 새벽(한국 시간 4시 17분 예약)에 뉴스를 모으고, AI로 분석하고, 사이트를 새로 올려요.
# GitHub가 예약 실행을 늦게 시작할 때가 많아서, 일부러 일찍 + 정각이 아닌 시간으로 잡았어요.
name: 세계경제 AI 업데이트

on:
  schedule:
    - cron: "17 19 * * *"  # UTC 19:17 = 한국 시간 새벽 4:17 (일요일 실행 때는 주간 정리도 만들어요)
  workflow_dispatch:        # Actions 화면에서 'Run workflow' 버튼으로 바로 실행 가능
    inputs:
      weekly:
        description: "주간 정리도 지금 만들기"
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["site/**"]      # 사이트 디자인만 고쳤을 때는 분석 없이 다시 올리기만 해요

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 프로그램 설치
        if: github.event_name != 'push'
        run: pip install -r requirements.txt

      - name: 뉴스 수집 + AI 분석
        if: github.event_name != 'push'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}        # 무료 (추천)
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # 유료 (나중에 바꾸고 싶을 때)
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          FORCE_WEEKLY: ${{ inputs.weekly }}
        run: python scripts/collect.py

      - name: 결과 저장 (기록 남기기)
        if: github.event_name != 'push'
        run: |
          git config user.name "world-economy-ai-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "오늘의 세계 경제 업데이트 $(TZ=Asia/Seoul date +%F)"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
